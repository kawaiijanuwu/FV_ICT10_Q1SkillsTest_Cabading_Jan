<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Skills Test</title>

    <!-- python -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- javascript-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <!-- same code as sw1 -->
    <style>
        body{
            font-family: 'Lato';
            background-color: #74A12E;
            text-align: center;
            color: #000000;;
            font-size: 25px;
        }
        .container {
            width: 650px;
            margin: 80px auto;
            padding: 30px;
            background-color: #F5EEDC;
            border-radius: 25px;
            box-shadow: 0 10 30px #3F5F24
        }
        .container button {
            padding: 12px 35px;
            margin: 15px;
            background-color: #C47A44;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        h1 {
            color: #3F5F24;
             font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            margin-bottom: 10px;
        }
        h3 {
            color: #5C3B28;
        }

        .pasta-option{
            display: flex;
            align-items: center;
            padding: 15px 20px;
            margin: 12px 0;
            background-color: FFF9EC;
            border: 2px solid
            border-radius: 12px
            font-size: 21px
        }
    </style>
</head>
<body>
<!-- container is the same as sw1, just copied the format -->
<div class="container">
    <h1>Jan's Pasta Kitchen</h1>
    <h3>Choose your pasta!!!</h3>
    <label class="pasta-option">
        <input type="checkbox" id="aglio_olio">
        Aglio Olio - ₱280.00
    </label>

    <label class="pasta-option">
        <input type="checkbox" id="pesto">
        Pesto - ₱250.00
    </label>

    
    <label class="pasta-option">
        <input type="checkbox" id="truffle_pasta">
        Truffle Pasta - ₱300.00
    </label>


    <button py-click="order">Order</button>

       <div class="receipt">
            <h3>Receipt</h3>

            <p>
                Subtotal: <span id="subtotal">₱0.00</span>
            </p>

            <p>
                VAT (12%): <span id="vat">₱0.00</span>
            </p>

            <p>
                Total: <span id="total">₱0.00</span>
            </p>
        </div>

    </div>


<script type="py" src="main.py"></script>
</div>
</body>
</html>
