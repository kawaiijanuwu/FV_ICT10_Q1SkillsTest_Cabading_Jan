<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Skills Test</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- same code as sw1 -->
    <style>
        body{
            font-family: 'Lato';
            background-color: #74A12E;
            text-align: center;
            color: #000000;;
            font-size: 25px;
        }
        .container {
            width: 650px;
            margin: 100px auto;
            padding: 30px;
            background-color: #F5EEDC;
            border-radius: 20px;
            box-shadow: 0 0 20px #3F5F24
        }
        .container button {
            padding: 5px 10px;
            margin: 2px;
            background-color: #C47A44;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 20px;
        }
    </style>
</head>
<body>
<!-- container is the same as sw1, just copied the format -->
<div class="container">
    <h1>Jan's Pasta Kitchen</h1>
    <h3>Choose your pasta!!!</h3>
    <label>
        <input type="checkbox" id="aglio_olio">
        Aglio Olio - ₱280.00
    </label>

    <br><br>

    <label>
        <input type="checkbox" id="pesto">
        Pesto - ₱250.00
    </label>

    <br><br>

    <label>
        <input type="checkbox" id="truffle_pasta">
        Truffle Pasta - ₱300.00
    </label>

    <br><br>

    <button py-click="order">Order</button>

       <div class="receipt">
            <h3>Receipt</h3>

            <p>
                Subtotal: <span id="subtotal">₱0.00</span>
            </p>

            <p>
                VAT (12%): <span id="vat">₱0.00</span>
            </p>

            <p>
                Total: <span id="total">₱0.00</span>
            </p>
        </div>

    </div>


<script type="py" src="main.py"></script>
</div>
</body>
</html>
